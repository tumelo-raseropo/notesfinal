<!DOCTYPE html>
<html>
<head>
<title>Online Notes</title>
<style>
body { font-family: sans-serif; padding: 20px; }
textarea { width: 100%; height: 150px; }
button { margin-top: 10px; padding: 10px 20px; }
ul { margin-top: 20px; }
</style>
</head>
<body>
<h2>Online Notes</h2>
<textarea id="note" placeholder="Type something..."></textarea><br>
<button onclick="saveNote()">Save</button>

<ul id="notesList"></ul>

<script>
const endpoint = "https://script.google.com/macros/s/AKfycbxa0iAENkYxw8djgGDQEwi_83BwxZGAbK5i28IcKIO4QIOZPhqZY4GeQTBPnHB1ElxV4w/exec";

function saveNote() {
const note = document.getElementById("note").value;
fetch(endpoint, {
method: "POST",
body: JSON.stringify({ note: note }),
headers: { "Content-Type": "application/json" }
}).then(() => {
alert("Note saved online!");
document.getElementById("note").value = "";
loadNotes();
});
}

function loadNotes() {
fetch(endpoint)
.then(res => res.json())
.then(notes => {
const list = document.getElementById("notesList");
list.innerHTML = "";
notes.reverse().forEach(n => {
const li = document.createElement("li");
li.textContent = n;
list.appendChild(li);
});
});
}

// Load notes on page load
loadNotes();
</script>
</body>
</html>
